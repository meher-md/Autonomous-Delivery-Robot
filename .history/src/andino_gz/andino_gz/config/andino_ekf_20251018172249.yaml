ekf_node:
  ros__parameters:
    use_sim_time: true

    # الإطارات
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    two_d_mode: true
    publish_tf: true
    frequency: 30.0
    sensor_timeout: 0.2

    # ناخد الأودوم اللي جاي من الجسر ونحوّله TF
    odom0: /odom
    odom0_config: [true,  true,  false,   # x y z
                   false, false, true,    # roll pitch yaw
                   true,  true,  false,   # vx vy vz
                   false, false, true,    # vroll vpitch vyaw
                   false, false, false]   # ax ay az
    odom0_differential: false
    odom0_relative:     false

    # لو عندك IMU ممكن تضيفه لاحقاً
    # imu0: /imu/data
    # imu0_config: [false, false, false,
    #               true,  true,  true,
    #               false, false, false,
    #               false, false, true,
    #               false, false, false]
